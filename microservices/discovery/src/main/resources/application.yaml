spring:
  application:
    name: discovery

server:
  port: 8761 # porta di default dell'Eureka Server

eureka:
  server:
    eviction-interval-timer-in-ms: 60000
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
